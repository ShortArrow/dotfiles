{{ define "main" }}
  <div class="container">
    <div class="page-header home-header">
      <div class="home-icon">{{ partial "site-icon.html" 88 }}</div>
      <div>
        <h1>{{ .Title }}</h1>
        {{ with .Description }}<p class="lede">{{ . }}</p>{{ end }}
      </div>
    </div>

    {{ with .Content }}
      <div class="prose">{{ partial "content.html" $ }}</div>
    {{ end }}

    {{ with .Sections }}
      <hr />
      {{ partial "card-grid.html" (.ByWeight) }}
    {{ end }}
  </div>
{{ end }}
