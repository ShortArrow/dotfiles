# config/_default/module.toml

# Tool documentation lives next to the tool it documents, and the site pulls it
# in from there. Symlinks under content/ used to do this and do not work: Hugo
# skips them on Linux, so the pages were never generated and /docs/ came out
# empty, while a Windows checkout writes them as text files whose contents are
# the target path — which Hugo renders as a one-word page titled
# ../../../bash/readme.md. Neither failure appears in the build output.
#
# A mount has no such ambiguity. Adding a tool page means adding a mount and
# giving that readme front matter with a title.
#
# Declaring any mount replaces the default one, so content/ itself is mounted
# first or every written page disappears. A page's language is the suffix in
# its target file name, never a mount's lang: Hugo 0.168 rejects lang, and
# 0.147, which deploys, has nothing to replace it with.
[[mounts]]
source = "content"
target = "content"

[[mounts]]
source = "bash/readme.md"
target = "content/docs/bash.en.md"

[[mounts]]
source = "deno/readme.md"
target = "content/docs/deno.en.md"

[[mounts]]
source = "js/readme.md"
target = "content/docs/js.en.md"

[[mounts]]
source = "lua/readme.md"
target = "content/docs/lua.en.md"

[[mounts]]
source = "nvim/readme.md"
target = "content/docs/nvim.en.md"

[[mounts]]
source = "nvim/src/tests/readme.md"
target = "content/docs/nvim-test.en.md"

[[mounts]]
source = "php/readme.md"
target = "content/docs/php.en.md"

[[mounts]]
source = "python/readme.md"
target = "content/docs/python.en.md"

[[mounts]]
source = "rust/readme.md"
target = "content/docs/rust.en.md"

[[mounts]]
source = "tmux/readme.md"
target = "content/docs/tmux.en.md"

[[mounts]]
source = "yaml/readme.md"
target = "content/docs/yaml.en.md"

[[mounts]]
source = "markdown/readme.md"
target = "content/docs/markdown.en.md"

[[mounts]]
source = "nvim-rescue/readme.md"
target = "content/docs/nvim-rescue.en.md"

# The tool readmes are English only. Mounting them into the Japanese
# section as well keeps /ja/docs/ navigable instead of empty; the Japanese
# section index says the pages themselves are in English.

[[mounts]]
source = "bash/readme.md"
target = "content/docs/bash.ja.md"

