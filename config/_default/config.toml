# config/_default/config.toml

baseURL = "https://dotfiles.shortarrow.jp/"
languageCode = "en"

# English is served from the root and Japanese from /ja/. Setting
# defaultContentLanguageInSubdir would move every English URL under /en/, so it
# stays off.
defaultContentLanguage = "en"
hasCJKLanguage = true

enableRobotsTXT = true

# The site has no use for tags or categories. An empty table stops Hugo
# generating term pages for the leftover `tags` in the tool readmes.
[taxonomies]
