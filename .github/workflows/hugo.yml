# Build verification for the site. Cloudflare Pages publishes it, from its own
# Git integration; nothing here deploys.
name: Site

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The version Cloudflare's build image ships. A build that only passes on a
  # newer Hugo would pass here and fail on deploy, so this one is the gate.
  build:
    runs-on: ubuntu-latest
    needs: [markdown-link-check, content-parity]
    strategy:
      fail-fast: false
      matrix:
        include:
          - hugo: 0.147.7
            role: deploy target
          - hugo: latest
            role: early warning
    name: build (Hugo ${{ matrix.hugo }} — ${{ matrix.role }})
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install Hugo CLI
        env:
          REQUESTED: ${{ matrix.hugo }}
        run: |
          set -euo pipefail
          if [ "$REQUESTED" = latest ]; then
            version=$(curl -fsSL https://api.github.com/repos/gohugoio/hugo/releases/latest | jq -r .tag_name)
            version=${version#v}
          else
            version=$REQUESTED
          fi
          echo "building with Hugo $version"
          wget -q -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${version}/hugo_extended_${version}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: hugo --minify --printPathWarnings

  # A page added or edited in one language only still builds, and still
  # renders — it just says something different depending on which language
  # the reader picked. Nothing else catches that.
  content-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Staleness is judged from the commit that last touched each file,
          # so the full history has to be present.
          fetch-depth: 0
      - run: ./scripts/check-content-parity.sh

  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.17
        with:
          use-quiet-mode: no
          use-verbose-mode: no
          folder-path: content/
          file-path: ./readme.md, ./LICENSE
          file-extension: .md
          max-depth: -1
